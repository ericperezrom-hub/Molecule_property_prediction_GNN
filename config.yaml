data:
  batch_size: 64
  target_idx: 4
  split_seed: 0
  data_debug: False
  size_debug: 500

model:
  model_type: "schnet"
  hidden_dim: 64
  num_layers: 2
  weight_seed: 0
  num_heads: 4

training:
  n_epochs: 200
  lr: 0.001
  patience: 15
  min_delta: 0.001
  optimizer_type: "adam"
  criterion_type: "l1"

logging:
  demo_project: "gnn-molecule-prediction-demos"
  gpu_debug: True
  config_debug: True 
